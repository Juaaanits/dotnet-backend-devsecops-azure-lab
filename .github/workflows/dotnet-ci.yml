name: .NET CI

on:
  push:
    branches:
      - main
      - "devops/**"
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Restore and build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ./sakenny.sln

      - name: Build
        run: dotnet build ./sakenny.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./sakenny.sln --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
