name: sakenny-lab
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["${MSSQL_HOST_PORT:-14330}:1433"]
    volumes: [sqlserver_data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    environment:
      AZURITE_ACCOUNTS: devstoreaccount1:${AZURITE_ACCOUNT_KEY}
    ports: ["10000:10000", "10001:10001", "10002:10002"]
    volumes: [azurite_data:/data]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=SakennyDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Database__ApplyMigrations: "true"
      AzureBlobStorage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=${AZURITE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AzureBlobStorage__ContainerName: images
      Jwt__Issuer: sakenny-compose
      Jwt__Audience: sakenny-compose-client
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiryMinutes: "60"
      Jwt__RememberMeExpiryMinutes: "10080"
      Jwt__RefreshTokenExpiryDays: "7"
      Jwt__RememberMeRefreshTokenExpiryDays: "30"
      BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD}
    ports: ["${API_HOST_PORT:-5111}:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      azurite: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      GRAFANA_SQL_PASSWORD: ${GRAFANA_SQL_PASSWORD}
    volumes:
      - ./monitoring/sql/init-grafana.sql:/scripts/init-grafana.sql:ro
    depends_on:
      api: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa
        -P "$${MSSQL_SA_PASSWORD}" -C
        -v GrafanaPassword="$${GRAFANA_SQL_PASSWORD}"
        -i /scripts/init-grafana.sql
    restart: "no"

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_MSSQL_HOST: sqlserver:1433
      GF_MSSQL_DATABASE: SakennyDB
      GF_MSSQL_USER: grafana_reader
      GF_MSSQL_PASSWORD: ${GRAFANA_SQL_PASSWORD}
    ports: ["${GRAFANA_HOST_PORT:-3000}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      sql-init: { condition: service_completed_successfully }

volumes:
  sqlserver_data:
  azurite_data:
  grafana_data:
